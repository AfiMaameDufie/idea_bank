<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idea Bank</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Idea Bank</h1>
    <button id="btn-new" class="btn-primary">+ New Idea</button>
  </header>

  <main>
    <ul id="idea-list"></ul>
    <p id="empty-state" hidden>No ideas yet. Add your first one!</p>
  </main>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">New Idea</h2>
      <form id="idea-form" novalidate>
        <input type="hidden" id="idea-id" />
        <div class="field">
          <label for="idea-title">Title <span class="required">*</span></label>
          <input type="text" id="idea-title" placeholder="What's the idea?" required />
          <span class="error-msg" id="title-error"></span>
        </div>
        <div class="field">
          <label for="idea-desc">Description</label>
          <textarea id="idea-desc" rows="4" placeholder="Describe it briefly…"></textarea>
        </div>
        <div class="field">
          <label for="idea-tags">Tags <span class="hint">(comma-separated)</span></label>
          <input type="text" id="idea-tags" placeholder="e.g. web, mobile, ai" />
        </div>
        <div class="modal-actions">
          <button type="button" id="btn-cancel" class="btn-secondary">Cancel</button>
          <button type="submit" id="btn-save" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
